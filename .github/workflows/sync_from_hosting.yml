name: Mirror hosting -> GitHub (SHA aware atomic)

on:
  workflow_dispatch:

concurrency:
  group: mirror-hosting
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Mirror hosting (SHA + normal)
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://nskmedia.net/rizwan"
          BASE42="$BASE/4.2"

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

          FOLDERS_42=(GL KR TW VNG)
          FOLDERS_ROOT=(BGMI GLITCH LDPLAYER LOG TEST1 TEST2 TEST3 TEST4)

          mkdir -p /tmp/new
          : > /tmp/delete.list
          : > /tmp/add.list

          sync_file() {
            local url="$1"
            local dest="$2"

            mkdir -p "$(dirname "$dest")"

            code=$(curl -L -A "$UA" -s -o /tmp/tmp.bin -w "%{http_code}" "$url" || true)

            if [[ "$code" == "404" ]]; then
              [[ -f "$dest" ]] && echo "$dest" >> /tmp/delete.list
              return
            fi

            [[ "$code" == "200" ]] || return

            if [[ -f "$dest" ]]; then
              old=$(sha256sum "$dest" | cut -d' ' -f1)
              new=$(sha256sum /tmp/tmp.bin | cut -d' ' -f1)
              [[ "$old" == "$new" ]] && return
              echo "$dest" >> /tmp/delete.list
            fi

            mkdir -p "/tmp/new/$(dirname "$dest")"
            mv /tmp/tmp.bin "/tmp/new/$dest"
            echo "$dest" >> /tmp/add.list
          }

          for f in "${FOLDERS_42[@]}"; do
            sync_file "$BASE42/$f/libopenplatform.so" "4.2/$f/libopenplatform.so"
          done

          for f in "${FOLDERS_ROOT[@]}"; do
            sync_file "$BASE/$f/libopenplatform.so" "$f/libopenplatform.so"
          done

      - name: PHASE 1 — HARD DELETE (SHA invalidation)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -s /tmp/delete.list ]]; then
            sort -u /tmp/delete.list | while read f; do rm -f "$f"; done
            git add -A
            git commit -m "mirror: delete files (invalidate cache)"
            git push origin main
          fi

      - name: PHASE 2 — ADD NEW FILES
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -s /tmp/add.list ]]; then
            sort -u /tmp/add.list | while read f; do
              mkdir -p "$(dirname "$f")"
              mv "/tmp/new/$f" "$f"
            done
            git add -A
            git commit -m "mirror: add updated files"
            git push origin main
          fi
